# Package -> architecture role.
#
# Pure name mapping (no version claims): used by the scanner to *infer* the
# architecture a project already uses, so later commands follow it instead of
# imposing a different stack.
#
# `match: exact` compares the package name; `match: prefix` matches a scope or
# name prefix such as `@react-navigation/`.

